<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKP2026 PARIMO - Kumpulan Link</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg-color-1: #4158D0;
            --bg-color-2: #C850C0;
            --bg-color-3: #FFCC70;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px auto;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 18px 24px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease-out forwards;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Generate delays for children */
        .links-container .link-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .links-container .link-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .links-container .link-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .links-container .link-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .links-container .link-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .links-container .link-card:nth-child(6) {
            animation-delay: 0.6s;
        }

        .links-container .link-card:nth-child(7) {
            animation-delay: 0.7s;
        }

        .links-container .link-card:nth-child(8) {
            animation-delay: 0.8s;
        }

        .links-container .link-card:nth-child(9) {
            animation-delay: 0.9s;
        }

        .links-container .link-card:nth-child(10) {
            animation-delay: 1.0s;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="profile-img">SKP</div>
        </div>

        <div class="links-container" id="links-container">
            <!-- Link will be injected here by JavaScript -->
        </div>
    </div>

    <script>
        // ==========================================
        // CARA MENAMBAH LINK BARU:
        // Cukup tambahkan { title: "NAMA LINK", url: "ALAMAT LINK" } ke dalam daftar di bawah ini.
        // Jangan lupa menambahkan koma (,) di akhir setiap entri, kecuali yang terakhir.
        // ==========================================
        const links = [
            {
                title: "Zoom Meeting (Join)",
                url: "https://zoom.us/j/93031668045?pwd=fFdptVjtO7dv8eEOCTeBPQjLJRsroW.1"
            },
            {
                title: "Kuesioner SKP",
                url: "https://drive.google.com/drive/folders/1NzSSj96KQVwqXE5o_34spp_HDvM8Tr_C?usp=sharing"
            },
            {
                title: "Bahan Ajar SKP",
                url: "https://drive.google.com/drive/folders/1-F_w7PhX1olgiJSon2QRv9WzrZMack0z?usp=sharing"
            },
            {
                title: "Virtual Background",
                url: "https://drive.google.com/drive/folders/1BdlYuLmK9ywFqKXX5HhM0zjoZ0pbgbML?usp=sharing"
            },
            {
                title: "Instrumen Pelatihan",
                url: "https://drive.google.com/drive/folders/10-yCQ5DH1qihu_zShA3twLDCGHA2XEV4?usp=sharing"
            }
        ];

        // Fungsi untuk me-render link ke dalam HTML
        const container = document.getElementById('links-container');

        links.forEach((link, index) => {
            const a = document.createElement('a');
            a.href = link.url;
            a.className = 'link-card';
            a.textContent = link.title;
            a.target = '_blank'; // Buka di tab baru
            a.rel = 'noopener noreferrer';

            // Tambahkan delay animasi jika lebih dari 10 link secara dinamis
            if (index >= 10) {
                a.style.animationDelay = `${(index + 1) * 0.1}s`;
            }

            container.appendChild(a);
        });
    </script>
</body>

</html>
